name: ci

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: MCP SDK subpath import smoke test
        run: node -e "require('@modelcontextprotocol/sdk/server/mcp.js'); require('@modelcontextprotocol/sdk/server/stdio.js')"
      - run: npm run check
      - run: npm run benchmark

  native-core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure native core
        if: runner.os != 'Windows'
        run: cmake -S native -B native/build -DNOMIC_BUILD_TESTS=ON
      - name: Configure native core with vcpkg
        if: runner.os == 'Windows'
        run: cmake -S native -B native/build -DNOMIC_BUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build native/build --config Release
      - run: ctest --test-dir native/build --output-on-failure -C Release

  native-addon:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure addon
        run: cmake -S native -B native/build-addon -DNOMIC_BUILD_TESTS=OFF -DNOMIC_BUILD_NODE_ADDON=ON -DNODE_INCLUDE_DIR="$(node -p "require('path').resolve(process.execPath, '../../include/node')")"
      - run: cmake --build native/build-addon --config Release
      - name: Load addon
        run: node -e "const a=require('./native/build-addon/nomic_native.node'); for(const n of ['openRepository','updateFiles','search','getDependencies','closeRepository']) if(typeof a[n] !== 'function') process.exit(1)"
